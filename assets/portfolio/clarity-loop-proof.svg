-serif" font-size="13" font-weight="700" fill="#d9ad55" letter-spacing="2">BOOK WORKFLOW</text><rect x="136" y="334" width="230" height="48" rx="10" fill="#112b3c"/><text x="158" y="364" font-family="Arial,Helvetica,sans-serif" font-size="15" fill="#e6f2f7">Manuscript workspace</text><rect x="136" y="396" width="230" height="48" rx="10" fill="#0d2434"/><text x="158" y="426" font-family="Arial,Helvetica,sans-serif" font-size="15" fill="#bad0db">Publishing readiness</text><rect x="136" y="458" width="230" height="48" rx="10" fill="#0d2434"/><text x="158" y="488" font-family="Arial,Helvetica,sans-serif" font-size="15" fill="#bad0db">Multilingual delivery</text></g><g><text x="438" y="205" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="700" fill="#67d8ff" letter-spacing="2">AI-ASSISTED PUBLISHING</text><text x="438" y="252" font-family="Arial,Helvetica,sans-serif" font-size="35" font-weight="700" fill="#f5f9fb">From idea to structured book.</text><text x="438" y="286" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#abc1cc">Plan, organize, translate and prepare manuscripts in one workspace.</text><rect x="438" y="328" width="284" height="190" rx="16" fill="#0d2232" stroke="#23475d"/><text x="466" y="365" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="700" fill="#d9ad55">MANUSCRIPT</text><rect x="466" y="386" width="220" height="12" rx="6" fill="#24475b"/><rect x="466" y="410" width="186" height="10" rx="5" fill="#19384b"/><rect x="466" y="432" width="206" height="10" rx="5" fill="#19384b"/><rect x="466" y="454" width="166" height="10" rx="5" fill="#19384b"/><rect x="466" y="482" width="112" height="22" rx="11" fill="#1d586f"/><rect x="746" y="328" width="330" height="88" rx="16" fill="#0d2232" stroke="#23475d"/><text x="774" y="363" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="700" fill="#67d8ff">TRANSLATION</text><text x="774" y="392" font-family="Arial,Helvetica,sans-serif" font-size="20