name: CI

on:
  pull_request:
  push:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Lint HTML
        run: node scripts/lint-html.js

      - name: Typecheck config
        run: node scripts/typecheck-config.js

      - name: Build check
        run: node scripts/build-check.js

      - name: Form endpoint integration test
        run: node scripts/test-form-endpoints.js

      - name: AgentOS orchestration tests
        run: node scripts/test-agentos.js

      - name: Globe projection checks
        run: node scripts/test-earth-globe.js

      - name: Public deployment boundary
        run: node scripts/test-public-site.js

      - name: Link checker
        uses: lycheeverse/lychee-action@v1
        with:
          args: --config .lychee.toml .

  globe-visuals:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install isolated browser test tools
        run: |
          npm install --prefix "$RUNNER_TEMP/globe-browser" --no-save --package-lock=false playwright@1.62.1
          node "$RUNNER_TEMP/globe-browser/node_modules/playwright/cli.js" install --with-deps chromium
      - name: Check integrated geographic visuals
        env:
          NODE_PATH: ${{ runner.temp }}/globe-browser/node_modules
          PUBLIC_SITE_TEST_ORIGIN: http://127.0.0.1:8010
        run: |
          set -euo pipefail
          export CHROMIUM_PATH="$(node -p "require('playwright').chromium.executablePath()")"
          node scripts/build-site.js
          python3 -m http.server 8010 --bind 127.0.0.1 --directory site-dist >"$RUNNER_TEMP/globe-http.log" 2>&1 &
          globe_server_pid=$!
          trap 'kill "$globe_server_pid"' EXIT
          for attempt in {1..30}; do
            if curl -fsS http://127.0.0.1:8010/index.html >/dev/null; then break; fi
            sleep 1
          done
          node scripts/test-earth-globe-browser.js
          node scripts/test-agentos-public-browser.js
