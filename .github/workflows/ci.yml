name: CI

on:
  pull_request:
  push:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Lint HTML
        run: node scripts/lint-html.js

      - name: Typecheck config
        run: node scripts/typecheck-config.js

      - name: Build check
        run: node scripts/build-check.js

      - name: Form endpoint integration test
        run: node scripts/test-form-endpoints.js

      - name: AgentOS orchestration tests
        run: node scripts/test-agentos.js

      - name: RUSTGIS point operations
        run: node scripts/test-rustgis.js

      - name: Link checker
        uses: lycheeverse/lychee-action@v1
        with:
          args: --config .lychee.toml .

  rustgis-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install isolated browser test tools
        run: |
          npm install --prefix "$RUNNER_TEMP/rustgis-browser" --no-save --package-lock=false playwright@1.62.1
          node "$RUNNER_TEMP/rustgis-browser/node_modules/playwright/cli.js" install --with-deps chromium
      - name: Test the actual self-hosted RustGIS engine
        env:
          NODE_PATH: ${{ runner.temp }}/rustgis-browser/node_modules
        run: |
          set -euo pipefail
          export CHROMIUM_PATH="$(node -p "require('playwright').chromium.executablePath()")"
          python3 -m http.server 8010 --bind 127.0.0.1 >"$RUNNER_TEMP/rustgis-http.log" 2>&1 &
          rustgis_server_pid=$!
          trap 'kill "$rustgis_server_pid"' EXIT
          for attempt in {1..30}; do
            if curl -fsS http://127.0.0.1:8010/rustgis.html >/dev/null; then break; fi
            sleep 1
          done
          node scripts/test-rustgis-runtime.js
